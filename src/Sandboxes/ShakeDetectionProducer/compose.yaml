services:
    shake-detection-producer:
        # https://github.com/YumNumm/KyoshinEewViewerIngen/pkgs/container/shake-detection-producer
        image: ghcr.io/yumnumm/shake-detection-producer:latest
        build:
            context: ../../..
            dockerfile: src/Sandboxes/ShakeDetectionProducer/Dockerfile
        ports:
            - "5000:5000"
        platform: linux/amd64
        environment:
            - TIMER_OFFSET_MS=${TIMER_OFFSET_MS:-1100}
            - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
            - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-shake-detection-producer}
            - PORT=5000
            - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
            - KAFKA_TOPIC=${KAFKA_TOPIC:-shake-detect-events}
        restart: unless-stopped
        depends_on:
            - kafka

    kafka:
        # https://hub.docker.com/r/apache/kafka
        image: apache/kafka:4.1.1
        ports:
            - "9092:9092"
        environment:
            # KRaft mode settings
            - KAFKA_NODE_ID=1
            - KAFKA_PROCESS_ROLES=broker,controller
            - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
            # Listeners
            - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
            - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
            - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
            - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
            # Topic settings
            - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
            - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
            - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
            - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
        restart: always
