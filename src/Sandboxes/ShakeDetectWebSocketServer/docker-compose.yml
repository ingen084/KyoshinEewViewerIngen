services:
  shake-detect-server:
    image: git.yumnumm.dev/shake-detect-websocket-server:latest
    build:
      context: ../../..
      dockerfile: src/Sandboxes/ShakeDetectWebSocketServer/Dockerfile
    ports:
      - "5000:5000"
    environment:
      # OpenTelemetry設定 - 外部のTempoに接続
      # OTEL_EXPORTER_OTLP_ENDPOINTを設定するとトレースとメトリクスが送信される
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-shake-detect-websocket-server}
      - PORT=5000
    restart: unless-stopped
    volumes:
      - shake-detect-data:/app/data
    # 外部ネットワーク（Grafanaスタック）に接続する場合はnetworksを設定
    # networks:
    #   - grafana-stack

volumes:
  shake-detect-data:

# 外部ネットワークを使用する場合はコメントアウトを外す
# networks:
#   grafana-stack:
#     external: true
