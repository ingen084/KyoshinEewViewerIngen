name: release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
jobs:
  publish:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        os: [windows, ubuntu]
        arch: [x64, arm64]
    env:
      RELEASE_PREFIX: KyoshinEewViewer
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        submodules: 'recursive'
    - uses: FranzDiebold/github-env-vars-action@e8118971bd6b60524ae66a2d870bc83088e3a3c9 # v2.9.0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: 10.0.x
    
    - name: Parse version from tag
      id: version
      run: |
        if [[ "${{ github.ref }}" =~ refs/tags/(.*) ]]; then
          TAG_NAME="${BASH_REMATCH[1]}"
          
          if [[ "$TAG_NAME" == *"-"* ]]; then
            # suffix有り: 1.0.0-alpha → APP_VERSION=1.0.0, VERSION_SUFFIX=alpha
            APP_VERSION=$(echo "$TAG_NAME" | cut -d'-' -f1)
            VERSION_SUFFIX=$(echo "$TAG_NAME" | cut -d'-' -f2-)
          else
            # suffix無し: 1.0.0 → APP_VERSION=1.0.0, VERSION_SUFFIX=""
            APP_VERSION="$TAG_NAME"
            VERSION_SUFFIX=""
          fi
          
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> $GITHUB_OUTPUT
          echo "Parsed version: $APP_VERSION, suffix: $VERSION_SUFFIX"
        else
          # タグ以外（手動実行など）
          echo "APP_VERSION=0.1.1" >> $GITHUB_OUTPUT
          echo "VERSION_SUFFIX=" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Build
      run: >
        dotnet publish src/KyoshinEewViewer.Desktop/KyoshinEewViewer.Desktop.csproj
        -c Release
        -r ${{ fromJson('{ "windows": "win", "ubuntu": "linux" }')[matrix.os] }}-${{ matrix.arch }}
        -o tmp
        -p:PublishSingleFile=true
        --self-contained true
      env:
        APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
        VERSION_SUFFIX: ${{ steps.version.outputs.VERSION_SUFFIX }}
        BUILD_NUMBER: ${{ env.CI_RUN_NUMBER }}


    - name: Add permission
      if: matrix.os != 'windows'
      run: |
        mv tmp/KyoshinEewViewer.Desktop tmp/KyoshinEewViewer
        chmod +x tmp/KyoshinEewViewer
    - name: Rename files
      if: matrix.os == 'windows'
      run: move tmp/KyoshinEewViewer.Desktop.exe tmp/KyoshinEewViewer.exe

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.RELEASE_PREFIX }}-${{ matrix.os }}-${{ matrix.arch }}
        path: tmp/*

    - name: Archive
      uses: TheDoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
      if: startsWith(github.ref, 'refs/tags/')
      with:
        type: 'zip'
        directory: tmp
        path: '*'
        filename: ../${{ env.RELEASE_PREFIX }}-${{ matrix.os }}-${{ matrix.arch }}.zip

    - name: Upload release assets
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: release-${{ matrix.os }}-${{ matrix.arch }}
        path: ${{ env.RELEASE_PREFIX }}-${{ matrix.os }}-${{ matrix.arch }}.zip

  publish-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    env:
      RELEASE_PREFIX: KyoshinEewViewer
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        submodules: 'recursive'
    - uses: FranzDiebold/github-env-vars-action@e8118971bd6b60524ae66a2d870bc83088e3a3c9 # v2.9.0

    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: 10.0.x

    - name: Parse version from tag
      id: version
      run: |
        if [[ "${{ github.ref }}" =~ refs/tags/(.*) ]]; then
          TAG_NAME="${BASH_REMATCH[1]}"

          if [[ "$TAG_NAME" == *"-"* ]]; then
            # suffix有り: 1.0.0-alpha → APP_VERSION=1.0.0, VERSION_SUFFIX=alpha
            APP_VERSION=$(echo "$TAG_NAME" | cut -d'-' -f1)
            VERSION_SUFFIX=$(echo "$TAG_NAME" | cut -d'-' -f2-)
          else
            # suffix無し: 1.0.0 → APP_VERSION=1.0.0, VERSION_SUFFIX=""
            APP_VERSION="$TAG_NAME"
            VERSION_SUFFIX=""
          fi

          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> $GITHUB_OUTPUT
          echo "Parsed version: $APP_VERSION, suffix: $VERSION_SUFFIX"
        else
          # タグ以外(手動実行など)
          echo "APP_VERSION=0.1.1" >> $GITHUB_OUTPUT
          echo "VERSION_SUFFIX=" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Build
      run: >
        dotnet publish src/KyoshinEewViewer.Desktop/KyoshinEewViewer.Desktop.csproj
        -c Release
        -r osx-${{ matrix.arch }}
        -o tmp
        -p:PublishSingleFile=true
        --self-contained true
      env:
        APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
        VERSION_SUFFIX: ${{ steps.version.outputs.VERSION_SUFFIX }}
        BUILD_NUMBER: ${{ env.CI_RUN_NUMBER }}

    - name: Packaging
      run: |
        mkdir tmp2
        cp -r build-files/KyoshinEewViewer.Desktop.app tmp2/
        sed -i -e "s/KEVI_VERSION/$APP_VERSION/" tmp2/KyoshinEewViewer.Desktop.app/Contents/Info.plist
        mkdir tmp2/KyoshinEewViewer.Desktop.app/Contents/MacOS
        mv tmp/* tmp2/KyoshinEewViewer.Desktop.app/Contents/MacOS/
      env:
        APP_VERSION: ${{ (contains(github.ref, 'tags/') && env.CI_ACTION_REF_NAME) || '0.1.1' }}
    
    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.RELEASE_PREFIX }}-macos-${{ matrix.arch }}
        path: tmp2/*

    - name: Archive
      uses: TheDoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
      if: startsWith(github.ref, 'refs/tags/')
      with:
        type: 'zip'
        directory: tmp2
        path: '*'
        filename: ../${{ env.RELEASE_PREFIX }}-macos-${{ matrix.arch }}.zip

    - name: Upload release assets
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: release-macos-${{ matrix.arch }}
        path: ${{ env.RELEASE_PREFIX }}-macos-${{ matrix.arch }}.zip

  create-release:
    needs: [publish, publish-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: FranzDiebold/github-env-vars-action@e8118971bd6b60524ae66a2d870bc83088e3a3c9 # v2.9.0

    - name: Download all release assets
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: release-*
        path: release-assets
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
      with:
        files: release-assets/*
        name: v${{ env.CI_ACTION_REF_NAME }}
        draft: true
        prerelease: false
