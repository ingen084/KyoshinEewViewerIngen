name: release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
jobs:
  publish:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        os: [windows, ubuntu]
        arch: [x64, arm64]
    env:
      RELEASE_PREFIX: KyoshinEewViewer
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: 'recursive'
    - uses: FranzDiebold/github-env-vars-action@v2
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 9.0.x
    
    - name: Parse version from tag
      id: version
      run: |
        if [[ "${{ github.ref }}" =~ refs/tags/(.*) ]]; then
          TAG_NAME="${BASH_REMATCH[1]}"
          
          if [[ "$TAG_NAME" == *"-"* ]]; then
            # suffix有り: 1.0.0-alpha → APP_VERSION=1.0.0, VERSION_SUFFIX=alpha
            APP_VERSION=$(echo "$TAG_NAME" | cut -d'-' -f1)
            VERSION_SUFFIX=$(echo "$TAG_NAME" | cut -d'-' -f2-)
          else
            # suffix無し: 1.0.0 → APP_VERSION=1.0.0, VERSION_SUFFIX=""
            APP_VERSION="$TAG_NAME"
            VERSION_SUFFIX=""
          fi
          
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> $GITHUB_OUTPUT
          echo "Parsed version: $APP_VERSION, suffix: $VERSION_SUFFIX"
        else
          # タグ以外（手動実行など）
          echo "APP_VERSION=0.1.1" >> $GITHUB_OUTPUT
          echo "VERSION_SUFFIX=" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Build
      run: >
        dotnet publish src/KyoshinEewViewer.Desktop/KyoshinEewViewer.Desktop.csproj
        -c Release
        -r ${{ fromJson('{ "windows": "win", "ubuntu": "linux" }')[matrix.os] }}-${{ matrix.arch }}
        -o tmp
        -p:PublishSingleFile=true
        --self-contained true
      env:
        APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
        VERSION_SUFFIX: ${{ steps.version.outputs.VERSION_SUFFIX }}
        BUILD_NUMBER: ${{ env.CI_RUN_NUMBER }}


    - name: Add permission
      if: matrix.os != 'windows'
      run: |
        mv tmp/KyoshinEewViewer.Desktop tmp/KyoshinEewViewer
        chmod +x tmp/KyoshinEewViewer
    - name: Rename files
      if: matrix.os == 'windows'
      run: move tmp/KyoshinEewViewer.Desktop.exe tmp/KyoshinEewViewer.exe

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_PREFIX }}-${{ matrix.os }}-${{ matrix.arch }}
        path: tmp/*

    - name: Archive
      uses: TheDoctor0/zip-release@0.6.0
      if: startsWith(github.ref, 'refs/tags/')
      with:
        type: 'zip'
        directory: tmp
        path: '*'
        filename: ../${{ env.RELEASE_PREFIX }}-${{ matrix.os }}-${{ matrix.arch }}.zip

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ${{ env.RELEASE_PREFIX }}-${{ matrix.os }}-${{ matrix.arch }}.zip
        name: v${{ env.CI_ACTION_REF_NAME }}
        draft: true
        prerelease: false

  publish-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    env:
      RELEASE_PREFIX: KyoshinEewViewer
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: 'recursive'
    - uses: FranzDiebold/github-env-vars-action@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 9.0.x

    - name: Parse version from tag
      id: version
      run: |
        if [[ "${{ github.ref }}" =~ refs/tags/(.*) ]]; then
          TAG_NAME="${BASH_REMATCH[1]}"

          if [[ "$TAG_NAME" == *"-"* ]]; then
            # suffix有り: 1.0.0-alpha → APP_VERSION=1.0.0, VERSION_SUFFIX=alpha
            APP_VERSION=$(echo "$TAG_NAME" | cut -d'-' -f1)
            VERSION_SUFFIX=$(echo "$TAG_NAME" | cut -d'-' -f2-)
          else
            # suffix無し: 1.0.0 → APP_VERSION=1.0.0, VERSION_SUFFIX=""
            APP_VERSION="$TAG_NAME"
            VERSION_SUFFIX=""
          fi

          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> $GITHUB_OUTPUT
          echo "Parsed version: $APP_VERSION, suffix: $VERSION_SUFFIX"
        else
          # タグ以外(手動実行など)
          echo "APP_VERSION=0.1.1" >> $GITHUB_OUTPUT
          echo "VERSION_SUFFIX=" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Build
      run: >
        dotnet publish src/KyoshinEewViewer.Desktop/KyoshinEewViewer.Desktop.csproj
        -c Release
        -r osx-${{ matrix.arch }}
        -o tmp
        -p:PublishSingleFile=true
        --self-contained true
      env:
        APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
        VERSION_SUFFIX: ${{ steps.version.outputs.VERSION_SUFFIX }}
        BUILD_NUMBER: ${{ env.CI_RUN_NUMBER }}

    - name: Packaging
      run: |
        mkdir tmp2
        cp -r build-files/KyoshinEewViewer.Desktop.app tmp2/
        sed -i -e "s/KEVI_VERSION/$APP_VERSION/" tmp2/KyoshinEewViewer.Desktop.app/Contents/Info.plist
        mkdir tmp2/KyoshinEewViewer.Desktop.app/Contents/MacOS
        mv tmp/* tmp2/KyoshinEewViewer.Desktop.app/Contents/MacOS/
      env:
        APP_VERSION: ${{ (contains(github.ref, 'tags/') && env.CI_ACTION_REF_NAME) || '0.1.1' }}
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_PREFIX }}-macos-${{ matrix.arch }}
        path: tmp2/*

    - name: Archive
      uses: TheDoctor0/zip-release@0.6.0
      if: startsWith(github.ref, 'refs/tags/')
      with:
        type: 'zip'
        directory: tmp2
        path: '*'
        filename: ../${{ env.RELEASE_PREFIX }}-macos-${{ matrix.arch }}.zip

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ env.RELEASE_PREFIX }}-macos-${{ matrix.arch }}.zip
        name: v${{ env.CI_ACTION_REF_NAME }}
        draft: true
        prerelease: false
