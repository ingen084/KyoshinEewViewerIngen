name: release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
jobs:
  publish:
    runs-on: ${{ fromJson('{"windows":"windows-latest","ubuntu":"ubuntu-latest","macos":"macos-latest"}')[matrix.os] }}
    strategy:
      matrix:
        os: [windows, ubuntu, macos]
        arch: [x64, arm64]
    env:
      RELEASE_PREFIX: KyoshinEewViewer
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        submodules: 'recursive'
    - uses: FranzDiebold/github-env-vars-action@e8118971bd6b60524ae66a2d870bc83088e3a3c9 # v2.9.0

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: 10.0.x

    - name: Parse version from tag
      id: version
      run: |
        if [[ "${{ github.ref }}" =~ refs/tags/(.*) ]]; then
          TAG_NAME="${BASH_REMATCH[1]}"

          if [[ "$TAG_NAME" == *"-"* ]]; then
            # suffix有り: 1.0.0-alpha → APP_VERSION=1.0.0, VERSION_SUFFIX=alpha
            APP_VERSION=$(echo "$TAG_NAME" | cut -d'-' -f1)
            VERSION_SUFFIX=$(echo "$TAG_NAME" | cut -d'-' -f2-)
          else
            # suffix無し: 1.0.0 → APP_VERSION=1.0.0, VERSION_SUFFIX=""
            APP_VERSION="$TAG_NAME"
            VERSION_SUFFIX=""
          fi

          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> $GITHUB_OUTPUT
          echo "Parsed version: $APP_VERSION, suffix: $VERSION_SUFFIX"
        else
          # タグ以外（手動実行など）
          echo "APP_VERSION=0.1.1" >> $GITHUB_OUTPUT
          echo "VERSION_SUFFIX=" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Build
      id: build
      uses: ./.github/actions/publish-kevi
      with:
        os: ${{ matrix.os }}
        arch: ${{ matrix.arch }}
        app-version: ${{ steps.version.outputs.APP_VERSION }}
        version-suffix: ${{ steps.version.outputs.VERSION_SUFFIX }}
        build-number: ${{ env.CI_RUN_NUMBER }}
        bundle-version: ${{ (contains(github.ref, 'tags/') && env.CI_ACTION_REF_NAME) || '0.1.1' }}
        output-dir: out

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.RELEASE_PREFIX }}-${{ matrix.os }}-${{ matrix.arch }}
        path: out/dist/*

    - name: Archive
      uses: TheDoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
      if: startsWith(github.ref, 'refs/tags/')
      with:
        type: 'zip'
        directory: out/dist
        path: '*'
        filename: ../../${{ env.RELEASE_PREFIX }}-${{ matrix.os }}-${{ matrix.arch }}.zip

    - name: Upload release assets
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: release-${{ matrix.os }}-${{ matrix.arch }}
        path: ${{ env.RELEASE_PREFIX }}-${{ matrix.os }}-${{ matrix.arch }}.zip

  create-release:
    needs: [publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: FranzDiebold/github-env-vars-action@e8118971bd6b60524ae66a2d870bc83088e3a3c9 # v2.9.0

    - name: Download all release assets
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: release-*
        path: release-assets
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
      with:
        files: release-assets/*
        name: v${{ env.CI_ACTION_REF_NAME }}
        draft: true
        prerelease: false
