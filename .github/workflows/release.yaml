name: Release

on:
  push:
    branches:
      - develop
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "ShakeDetection イメージのタグ（既定: latest）"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/shake-detection-producer

jobs:
  # develop への push または手動実行時のみ（タグ push では実行しない）
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # https://github.com/docker/login-action
      - name: Log in to Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # https://github.com/docker/metadata-action
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag || 'latest' }}
            type=sha,prefix=
            type=ref,event=branch

      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: src/Sandboxes/ShakeDetectionProducer/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        os: [windows, ubuntu]
        arch: [x64, arm64]
    env:
      RELEASE_PREFIX: KyoshinEewViewer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: FranzDiebold/github-env-vars-action@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Parse version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/(.*) ]]; then
            TAG_NAME="${BASH_REMATCH[1]}"

            if [[ "$TAG_NAME" == *"-"* ]]; then
              APP_VERSION=$(echo "$TAG_NAME" | cut -d'-' -f1)
              VERSION_SUFFIX=$(echo "$TAG_NAME" | cut -d'-' -f2-)
            else
              APP_VERSION="$TAG_NAME"
              VERSION_SUFFIX=""
            fi

            echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT
            echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> $GITHUB_OUTPUT
            echo "Parsed version: $APP_VERSION, suffix: $VERSION_SUFFIX"
          else
            echo "APP_VERSION=0.1.1" >> $GITHUB_OUTPUT
            echo "VERSION_SUFFIX=" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Build
        run: >
          dotnet publish src/KyoshinEewViewer.Desktop/KyoshinEewViewer.Desktop.csproj
          -c Release
          -r ${{ fromJson('{ "windows": "win", "ubuntu": "linux" }')[matrix.os] }}-${{ matrix.arch }}
          -o tmp
          -p:PublishSingleFile=true
          --self-contained true
        env:
          APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
          VERSION_SUFFIX: ${{ steps.version.outputs.VERSION_SUFFIX }}
          BUILD_NUMBER: ${{ env.CI_RUN_NUMBER }}

      - name: Add permission
        if: matrix.os != 'windows'
        run: |
          mv tmp/KyoshinEewViewer.Desktop tmp/KyoshinEewViewer
          chmod +x tmp/KyoshinEewViewer
      - name: Rename files
        if: matrix.os == 'windows'
        run: move tmp/KyoshinEewViewer.Desktop.exe tmp/KyoshinEewViewer.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_PREFIX }}-${{ matrix.os }}-${{ matrix.arch }}
          path: tmp/*

      - name: Archive
        uses: TheDoctor0/zip-release@0.6.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          type: "zip"
          directory: tmp
          path: "*"
          filename: ../${{ env.RELEASE_PREFIX }}-${{ matrix.os }}-${{ matrix.arch }}.zip

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.RELEASE_PREFIX }}-${{ matrix.os }}-${{ matrix.arch }}.zip

  publish-macos:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    env:
      RELEASE_PREFIX: KyoshinEewViewer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: FranzDiebold/github-env-vars-action@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Parse version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/(.*) ]]; then
            TAG_NAME="${BASH_REMATCH[1]}"

            if [[ "$TAG_NAME" == *"-"* ]]; then
              APP_VERSION=$(echo "$TAG_NAME" | cut -d'-' -f1)
              VERSION_SUFFIX=$(echo "$TAG_NAME" | cut -d'-' -f2-)
            else
              APP_VERSION="$TAG_NAME"
              VERSION_SUFFIX=""
            fi

            echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT
            echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> $GITHUB_OUTPUT
            echo "Parsed version: $APP_VERSION, suffix: $VERSION_SUFFIX"
          else
            echo "APP_VERSION=0.1.1" >> $GITHUB_OUTPUT
            echo "VERSION_SUFFIX=" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Build
        run: >
          dotnet publish src/KyoshinEewViewer.Desktop/KyoshinEewViewer.Desktop.csproj
          -c Release
          -r osx-${{ matrix.arch }}
          -o tmp
          -p:PublishSingleFile=true
          --self-contained true
        env:
          APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}
          VERSION_SUFFIX: ${{ steps.version.outputs.VERSION_SUFFIX }}
          BUILD_NUMBER: ${{ env.CI_RUN_NUMBER }}

      - name: Packaging
        run: |
          mkdir tmp2
          cp -r build-files/KyoshinEewViewer.Desktop.app tmp2/
          sed -i -e "s/KEVI_VERSION/$APP_VERSION/" tmp2/KyoshinEewViewer.Desktop.app/Contents/Info.plist
          mkdir tmp2/KyoshinEewViewer.Desktop.app/Contents/MacOS
          mv tmp/* tmp2/KyoshinEewViewer.Desktop.app/Contents/MacOS/
        env:
          APP_VERSION: ${{ steps.version.outputs.APP_VERSION }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_PREFIX }}-macos-${{ matrix.arch }}
          path: tmp2/*

      - name: Archive
        uses: TheDoctor0/zip-release@0.6.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          type: "zip"
          directory: tmp2
          path: "*"
          filename: ../${{ env.RELEASE_PREFIX }}-macos-${{ matrix.arch }}.zip

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-macos-${{ matrix.arch }}
          path: ${{ env.RELEASE_PREFIX }}-macos-${{ matrix.arch }}.zip

  create-release:
    needs: [publish, publish-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: FranzDiebold/github-env-vars-action@v2

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: v${{ env.CI_ACTION_REF_NAME }}
          draft: true
          prerelease: false
