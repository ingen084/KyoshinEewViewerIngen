name: release PiDASPlusGraph

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        default: "0.1.2"
jobs:
  publish:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        os: [windows, ubuntu]
        arch: [x64, arm64]
    env:
      RELEASE_PREFIX: PiDASPlusGraph
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      with:
        submodules: 'recursive'
    - uses: FranzDiebold/github-env-vars-action@e8118971bd6b60524ae66a2d870bc83088e3a3c9 # v2.9.0

    - name: Setup .NET
      uses: actions/setup-dotnet@871f041373faaad213a635d9afb62905ec029bbb # v1.10.1
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: >
        dotnet publish src/Sandboxes/PiDASPlusGraph/PiDASPlusGraph.csproj
        -c Release
        -r ${{ fromJson('{ "windows": "win", "ubuntu": "linux" }')[matrix.os] }}-${{ matrix.arch }}
        -o tmp
        -p:PublishSingleFile=true
        --self-contained true
      env:
        APP_VERSION: ${{ github.event.inputs.version }}
        BUILD_NUMBER: ${{ env.CI_RUN_NUMBER }}

    - name: Add permission
      if: matrix.os != 'windows'
      run: |
        chmod +x tmp/PiDASPlusGraph

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ env.RELEASE_PREFIX }}-${{ github.event.inputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
        path: tmp/*
