name: integration-test

# 起動(スモークテスト)、画面操作(UIテスト)、自動アップデート完了までの結合テストを各プラットフォームで実行する。
# 本番のGitHub Releases APIには接続せず、ローカルのモックサーバーとダミー新バージョンを使う。
# リリース前の検査として release.yml から呼び出し、失敗した場合はリリースを作成しない。
# 依存ライブラリの更新でトリミングの結果が変わるので、ビルド設定を変える PR でも Linux x64 だけ確認する。
# UIテストが操作する画面を変える PR も、リリース時に初めて失敗しないように同じく確認する。
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.csproj'
      - 'common.props'
      - 'src/KyoshinEewViewer.Desktop/TrimmerRoots.xml'
      - 'tests/IntegrationTest/**'
      - '.github/actions/publish-kevi/**'
      - '.github/workflows/integration-test.yml'
      - 'src/KyoshinEewViewer.Desktop/IntegrationTest/**'
      - 'src/KyoshinEewViewer/Services/Workflows/**'
      - 'src/KyoshinEewViewer/Series/*/Workflow/**'
      - 'src/KyoshinEewViewer/Series/*/SettingPages/**'
      - 'src/KyoshinEewViewer/Series/Earthquake/**'
      - 'src/KyoshinEewViewer/Series/Qzss/**'
      - 'src/KyoshinEewViewer/Services/TelegramPublishers/JmaXml/**'
      - 'src/KyoshinEewViewer/Services/Voicevox/**'
      - 'src/KyoshinEewViewer.Core/PlatformDirectories.cs'
      - 'src/KyoshinEewViewer.DCReportParser/**'
      - 'src/KyoshinEewViewer.JmaXmlParser/**'
      - 'src/KyoshinEewViewer/Views/SettingWindow.axaml'
      - 'src/KyoshinEewViewer/Views/SettingPages/**'
      - 'src/KyoshinEewViewer/Views/*ThemeEditWindow*'
      - 'src/KyoshinEewViewer/Views/Components/TemplateEditor*'
      - 'src/KyoshinEewViewer/Views/Components/TemplateEditor/**'

permissions:
  contents: read

# 同じ PR の古い実行だけを止める。リリース前の検査は止めない
concurrency:
  group: integration-test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(github.event_name == 'pull_request' && '[{"runner":"ubuntu-latest","os":"ubuntu","arch":"x64"}]' || '[{"runner":"windows-latest","os":"windows","arch":"x64"},{"runner":"windows-11-arm","os":"windows","arch":"arm64"},{"runner":"ubuntu-latest","os":"ubuntu","arch":"x64"},{"runner":"ubuntu-24.04-arm","os":"ubuntu","arch":"arm64"},{"runner":"macos-15-intel","os":"macos","arch":"x64"},{"runner":"macos-latest","os":"macos","arch":"arm64"}]') }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: 'recursive'

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 11.0.x

    - name: Install xvfb
      if: matrix.os == 'ubuntu'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: Build app (integration test build)
      id: build-app
      uses: ./.github/actions/publish-kevi
      with:
        os: ${{ matrix.os }}
        arch: ${{ matrix.arch }}
        app-version: 0.0.1
        integration-test-build: true
        output-dir: app-out

    - name: Build update dummy
      run: >
        dotnet publish tests/IntegrationTest/UpdateDummy/UpdateDummy.csproj
        -c Release
        -r ${{ fromJson('{"windows":"win","ubuntu":"linux","macos":"osx"}')[matrix.os] }}-${{ matrix.arch }}
        -o dummy-out
        -p:PublishSingleFile=true
        --self-contained true
      env:
        APP_VERSION: 99.0.0

    - name: Package update dummy
      shell: pwsh
      run: >
        tests/IntegrationTest/package-dummy.ps1
        -PublishDir dummy-out
        -Platform ${{ matrix.os }}
        -OutZip dummy-asset/KyoshinEewViewer-${{ matrix.os }}-${{ matrix.arch }}.zip
        -BundleVersion 99.0.0

    - name: Run smoke test
      shell: bash
      run: |
        PREFIX=""
        if [ "${{ matrix.os }}" = "ubuntu" ]; then PREFIX="xvfb-run -a"; fi
        $PREFIX pwsh tests/IntegrationTest/run-smoke-test.ps1 \
          -AppExePath "${{ steps.build-app.outputs.executable }}" \
          -ProfileTemplate tests/IntegrationTest/profiles/profile-smoke.json \
          -ExpectedVersion 0.0.1

    - name: Run UI test
      shell: bash
      run: |
        PREFIX=""
        if [ "${{ matrix.os }}" = "ubuntu" ]; then PREFIX="xvfb-run -a"; fi
        $PREFIX pwsh tests/IntegrationTest/run-ui-test.ps1 \
          -AppExePath "${{ steps.build-app.outputs.executable }}" \
          -ProfileTemplate tests/IntegrationTest/profiles/profile-ui.json

    - name: Run update test
      shell: bash
      run: |
        PREFIX=""
        if [ "${{ matrix.os }}" = "ubuntu" ]; then PREFIX="xvfb-run -a"; fi
        $PREFIX pwsh tests/IntegrationTest/run-update-test.ps1 \
          -AppExePath "${{ steps.build-app.outputs.executable }}" \
          -ProfileTemplate tests/IntegrationTest/profiles/profile-update.json \
          -NewVersionZip dummy-asset/KyoshinEewViewer-${{ matrix.os }}-${{ matrix.arch }}.zip \
          -AssetName KyoshinEewViewer-${{ matrix.os }}-${{ matrix.arch }}.zip \
          -ExpectedVersion 99.0.0

    - name: Upload logs
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: integration-logs-${{ matrix.os }}-${{ matrix.arch }}
        path: tmp/integration/
        if-no-files-found: ignore
